name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=readonly

      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=readonly

      # e2e suites skip themselves unless their WEB3INJ_E2E* gate is set, so
      # this runs unit tests plus the chain-free e2e helpers.
      - name: Test
        run: go test -race -count=1 ./...
        env:
          GOFLAGS: -mod=readonly
